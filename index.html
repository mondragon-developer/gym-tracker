<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Tracker</title>
    
    <!-- Custom styles for Chatbase chatbot bubble -->
    <style>
      /* Make only the chatbot bubble button larger, not the chat window */
      #chatbase-bubble-button,
      .chatbase-bubble-button,
      [data-chatbase="bubble"] {
        width: 70px !important;
        height: 70px !important;
        font-size: 28px !important;
        min-width: 70px !important;
        min-height: 70px !important;
      }
      
      /* src/lib/chatbase.js loads the assistant only after the signed-in
         account has accepted the terms. Once loaded it stays in the page,
         so it is hidden again whenever LegalGate removes the attribute
         from <html> (sign-out). */
      html:not([data-legal-accepted]) #chatbase-bubble-button,
      html:not([data-legal-accepted]) #chatbase-bubble-window,
      html:not([data-legal-accepted]) #chatbase-message-bubbles {
        display: none !important;
      }

      /* Target the bubble icon specifically */
      #chatbase-bubble-button svg,
      .chatbase-bubble-button svg {
        width: 32px !important;
        height: 32px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
